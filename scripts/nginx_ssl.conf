# Nginx SSL Configuration for HA Solutions
# Replace this server block in your nginx.conf file
# Location: C:\nginx\conf\nginx.conf

server {
    listen 80;
    server_name hasolutions.us www.hasolutions.us;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hasolutions.us www.hasolutions.us;

    # SSL Certificate paths (update these after running win-acme)
    ssl_certificate C:/ProgramData/win-acme/httpsacme-v02.api.letsencrypt.org/hasolutions.us-chain.pem;
    ssl_certificate_key C:/ProgramData/win-acme/httpsacme-v02.api.letsencrypt.org/hasolutions.us-key.pem;

    # SSL Configuration - Modern and Secure
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log logs/hasolutions_access.log;
    error_log logs/hasolutions_error.log;

    # Maximum upload size (for job applications with resumes)
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias C:/Websites/HA-Solutions/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias C:/Websites/HA-Solutions/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Django (Waitress)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

